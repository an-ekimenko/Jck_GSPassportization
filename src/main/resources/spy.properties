# Only modules listed are active.                               
# Default is com.p6spy.engine.logging.P6LogFactory and com.p6spy.engine.spy.P6SpyFactory.   
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory,com.p6spy.engine.outage.P6OutageFactory

# A comma separated list of JDBC drivers to load and register.
# This is normally only needed when using P6Spy in an application server environment with 
# a JNDI data source or when using a JDBC driver that does not implement the JDBC 4.0 API 
# [specifically automatic registration].
driverlist=com.microsoft.sqlserver.jdbc.SQLServerDriver

reloadproperties=true

# When set to true, every time a statement is intercepted, it's immediately written to the log file.
autoflush=true

dateformat=MM-dd-yy HH:mm:ss:SS

# All of these output in the CSV format [where separator is |].
appender=com.p6spy.engine.spy.appender.Slf4JLogger
#appender=com.p6spy.engine.spy.appender.StdoutLogger
#appender=com.p6spy.engine.spy.appender.FileLogger

logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
# logMessageFormat=com.p6spy.engine.spy.appender.SingleLineFormat
customLogMessageFormat=%(currentTime)|%(executionTime)|%(category)|connection%(connectionId)|%(sqlSingleLine)

logfile=logs/p6spy.log
append=false

filter=true
# A comma separated list of strings to include
include=insert,update

# List of categories to exclude {error, info, batch, debug, statement, commit, rollback, result, resultset}.
# Default values is info, debug, result, resultset, batch.
#excludecategories=info,debug,result,resultset,batch